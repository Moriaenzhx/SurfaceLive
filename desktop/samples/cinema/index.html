<!doctype html>
<html lang='zh-CN'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
  <meta name='theme-color' content='#fbf6ee'>
  <title>巷口放映 · 周末放映单</title>
  <link rel='stylesheet' href='./styles.css'>
  <script src='./app.js' defer></script>
</head>
<body>
  <div class='app'>
    <header class='masthead'>
      <div class='brand'>
        <span class='brand-mark' aria-hidden='true'><svg viewBox='0 0 24 24' fill='none'><path d='M4.5 10.5h15v8a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1zM4.5 10.5 3.7 7l14.6-3.5.8 3.5zM8 6l2 2.9m3.1-4.1 2 2.9' stroke='currentColor' stroke-width='1.5' stroke-linejoin='round'/><path d='m10 13 4 2-4 2z' fill='currentColor'/></svg></span>
        <span>巷口放映</span>
      </div>
      <span class='location'><svg viewBox='0 0 16 16' fill='none' aria-hidden='true'><path d='M12.5 6.6c0 3.2-4.5 6.5-4.5 6.5S3.5 9.8 3.5 6.6a4.5 4.5 0 0 1 9 0Z' stroke='currentColor' stroke-width='1.4'/><circle cx='8' cy='6.6' r='1.45' fill='currentColor'/></svg>梧桐里社区</span>
    </header>
    <main>
      <section class='hero' aria-labelledby='page-title'>
        <div class='hero-copy'>
          <p class='edition'>11.21 — 11.22</p>
          <h1 id='page-title'>周末<br>放映单</h1>
        </div>
        <svg class='hero-art' viewBox='0 0 184 176' fill='none' aria-hidden='true' focusable='false'>
          <defs>
            <linearGradient id='beam' x1='32' y1='127' x2='117' y2='52' gradientUnits='userSpaceOnUse'><stop stop-color='#ffd595' stop-opacity='.68'/><stop offset='1' stop-color='#ffd595' stop-opacity='.14'/></linearGradient>
            <clipPath id='screen'><path d='m77 48 87-10 4 71-89 5z'/></clipPath>
          </defs>
          <circle cx='120' cy='83' r='69' fill='#422747'/>
          <path d='M51 145c30-8 69-9 121-2m-112 10c42-5 73-4 100-1' stroke='#6f4a69' stroke-linecap='round'/>
          <path d='M92 105 81 144m70-38 13 33' stroke='#d0a4a1' stroke-width='2.3' stroke-linecap='round'/>
          <path d='m73 44 94-11 6 80-98 5z' fill='#f9c68e'/>
          <g clip-path='url(#screen)'>
            <path d='M72 33h101v86H72z' fill='#f4ab82'/>
            <circle cx='138' cy='64' r='15' fill='#ffe1a4'/>
            <path d='M67 104c21-20 33-22 50-13 19-19 36-20 62-13v40H67z' fill='#ad6577'/>
            <path d='M73 110c21-2 40-15 55-11 15 3 29-1 46-10v28H73z' fill='#684460'/>
            <path d='m125 104 11-16 12 13v10h-23z' fill='#442744'/>
            <path d='M136 101h4v5h-4z' fill='#ffc78e'/>
          </g>
          <path d='m42 124 31-80 2 74-31 14z' fill='url(#beam)'/>
          <path d='m37 126 10-4v10l-10 2z' fill='#ffcb8c'/>
          <rect x='16' y='122' width='24' height='16' rx='3' fill='#ad7094'/>
          <circle cx='23' cy='117' r='7' fill='#e4a99d'/>
          <circle cx='35' cy='116' r='5.5' fill='#e4a99d'/>
          <circle cx='23' cy='117' r='2' fill='#38233d'/>
          <circle cx='35' cy='116' r='1.7' fill='#38233d'/>
          <path d='m24 138-5 9m12-9 5 9' stroke='#ce9bb0' stroke-width='2' stroke-linecap='round'/>
          <path d='M61 24v12m-6-6h12M155 15v9m-4.5-4.5h9' stroke='#efbb86' stroke-width='1.4' stroke-linecap='round'/>
          <circle cx='47' cy='65' r='1.9' fill='#c896b1'/><circle cx='107' cy='23' r='1.6' fill='#c896b1'/><circle cx='176' cy='65' r='1.5' fill='#f6ca97'/>
        </svg>
      </section>

      <p class='scope'><strong>示例活动</strong><span>影片、地点与名额均为虚构</span></p>
      <div class='filters' role='group' aria-label='按日期筛选'>
        <button type='button' data-filter='all' aria-pressed='true'>全部</button>
        <button type='button' data-filter='2026-11-21' aria-pressed='false'>11.21 周六</button>
        <button type='button' data-filter='2026-11-22' aria-pressed='false'>11.22 周日</button>
      </div>

      <section class='day' data-day='2026-11-21' data-weekday='周六' aria-labelledby='saturday'>
        <h2 class='day-title' id='saturday'>周六 <time datetime='2026-11-21'>11 月 21 日</time></h2>
        <article class='screening' data-id='rooftop' data-seats='8'>
          <input class='choice' type='radio' name='screening' id='rooftop' aria-labelledby='rooftop-title' aria-describedby='rooftop-meta rooftop-venue rooftop-seats' checked>
          <label class='film' for='rooftop'>
            <span class='poster' aria-hidden='true'><svg viewBox='0 0 70 94' preserveAspectRatio='xMidYMid slice' focusable='false'><path fill='#eaae79' d='M0 0h70v94H0z'/><circle cx='46' cy='30' r='19' fill='#ffe0a0'/><path d='M0 57l15-8 11 6 15-12 29 14v37H0z' fill='#c17460'/><path d='M0 69l24-20 23 20v25H0zm46 5 15-14 9 7v27H46z' fill='#623b4b'/><path d='M18 70h10v14H18zm39 7h6v8h-6z' fill='#f9c788'/><path d='M23 70v14m-5-7h10' stroke='#a96153' stroke-width='1'/><path d='M11 25c3-2 5-1 7 1 1-2 4-2 6-1' fill='none' stroke='#724352' stroke-linecap='round'/></svg></span>
            <span class='film-info'>
              <span class='film-title' id='rooftop-title'>屋顶上的夏天</span>
              <span class='film-meta' id='rooftop-meta'><time datetime='2026-11-21T16:30'>16:30</time> · 家庭 · 88 分钟</span>
              <span class='venue' id='rooftop-venue'><span>榆树小院</span><span class='distance'>350 米</span></span>
              <span class='seats' id='rooftop-seats'>余 8 席</span>
            </span>
            <span class='pick' aria-hidden='true'></span>
          </label>
        </article>
        <article class='screening' data-id='postman' data-seats='3'>
          <input class='choice' type='radio' name='screening' id='postman' aria-labelledby='postman-title' aria-describedby='postman-meta postman-venue postman-seats'>
          <label class='film' for='postman'>
            <span class='poster' aria-hidden='true'><svg viewBox='0 0 70 94' preserveAspectRatio='xMidYMid slice' focusable='false'><path fill='#534469' d='M0 0h70v94H0z'/><path d='M51 13a15 15 0 1 0 7 24A16 16 0 0 1 51 13' fill='#fae0ae'/><path d='M14 19v8m-4-4h8m40 27v6m-3-3h6' stroke='#cfafd3' stroke-linecap='round'/><circle cx='30' cy='13' r='1.4' fill='#edc3cf'/><path d='M0 75c21-13 42-10 70 0v19H0z' fill='#80648b'/><path d='M-2 89c19-13 42-16 74-7v12H0z' fill='#372b4d'/><g transform='rotate(-14 32 58)'><rect x='15' y='47' width='34' height='22' rx='2' fill='#edac91'/><path d='m17 49 15 12 15-12m-30 18 10-9m20 9-10-9' fill='none' stroke='#8e526b' stroke-width='1.3' stroke-linejoin='round'/></g></svg></span>
            <span class='film-info'>
              <span class='film-title' id='postman-title'>月亮邮差</span>
              <span class='film-meta' id='postman-meta'><time datetime='2026-11-21T19:00'>19:00</time> · 动画 · 76 分钟</span>
              <span class='venue' id='postman-venue'><span>梧桐里活动室</span><span class='distance'>650 米</span></span>
              <span class='seats low' id='postman-seats'>余 3 席</span>
            </span>
            <span class='pick' aria-hidden='true'></span>
          </label>
        </article>
      </section>

      <section class='day' data-day='2026-11-22' data-weekday='周日' aria-labelledby='sunday'>
        <h2 class='day-title' id='sunday'>周日 <time datetime='2026-11-22'>11 月 22 日</time></h2>
        <article class='screening' data-id='river' data-seats='12'>
          <input class='choice' type='radio' name='screening' id='river' aria-labelledby='river-title' aria-describedby='river-meta river-venue river-seats'>
          <label class='film' for='river'>
            <span class='poster' aria-hidden='true'><svg viewBox='0 0 70 94' preserveAspectRatio='xMidYMid slice' focusable='false'><path fill='#adc5c1' d='M0 0h70v94H0z'/><circle cx='22' cy='24' r='10' fill='#f8dca0'/><path d='M0 49c15-17 29-18 45-9 8-6 18-7 25-6v60H0z' fill='#5d878b'/><path d='M70 39c-10 4-23 7-38 10-18 4-24 10-9 16 12 4 21 6 21 12 0 7-21 13-44 17h70V77c-4-9-18-15-35-19-8-2 7-8 35-14Z' fill='#e3d6ab'/><path d='M0 49c8-3 15-1 22 1m27 31c5-2 8-4 8-6' fill='none' stroke='#f7eccf' stroke-linecap='round'/><path d='m40 64 10 2-5 3-4-1z' fill='#a7574d'/><path d='M8 76V55m0 0-5 9h9zm0 9-6 9h12z' fill='#355d67' stroke='#355d67' stroke-linejoin='round'/></svg></span>
            <span class='film-info'>
              <span class='film-title' id='river-title'>小河转弯处</span>
              <span class='film-meta' id='river-meta'><time datetime='2026-11-22T15:30'>15:30</time> · 剧情 · 92 分钟</span>
              <span class='venue' id='river-venue'><span>河岸邻里馆</span><span class='distance'>900 米</span></span>
              <span class='seats' id='river-seats'>余 12 席</span>
            </span>
            <span class='pick' aria-hidden='true'></span>
          </label>
        </article>
      </section>
      <p class='empty' id='empty' role='status' hidden>这天暂无放映，可切换日期查看。</p>
      <p class='footnote'>示例距离均以梧桐里社区为起点。</p>
    </main>

    <footer class='dock' aria-label='放映报名'>
      <div class='dock-summary'>
        <p class='dock-title' id='selected-film'>屋顶上的夏天</p>
        <p class='feedback' data-testid='action-feedback' role='status' aria-atomic='true'>周六 16:30 · 1 位</p>
      </div>
      <button class='cta' type='button' data-testid='primary-action' aria-describedby='selected-film'>报名此场</button>
    </footer>
  </div>
</body>
</html>
